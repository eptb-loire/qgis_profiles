news-feed\items\httpsfeedqgisorg\entries\items\139\content="<p>The <strong>Call for Papers</strong> for the 2026 QGIS User Conference is <strong>now open</strong>! We welcome talks and workshops of all levels, from end users to developers, from academia to industry. Topics can include QGIS use cases, new features, ecosystem tools, and more. Submit your proposal by<strong> 12 April 2026 at 23:59</strong> (Europe/Zurich). See you in Laax! \xd83c\xdfd4\xfe0f</p>\r\n<p><strong>Double click here</strong> for more information&nbsp;</p>"
