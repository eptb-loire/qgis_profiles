news-feed\items\httpsfeedqgisorg\entries\items\140\content="<p>QGIS 4.0 is out and we're raising funds to support what comes next. This year we're <strong>aiming to grow sustaining membership</strong> income by &euro;100,000 to fund more bug fixing, faster pull request reviews, a project secretary for the PSC, expanded security work, and a larger grants programme.</p>\r\n<p>Memberships start at &euro;500/year. Every new member counts.</p><p><strong>Double click here for more information</strong></p>"
