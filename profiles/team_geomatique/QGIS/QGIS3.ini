news-feed\items\httpsfeedqgisorg\entries\items\177\content="<p data-sourcepos=\"68:1-68:97\">Les prochaines rencontres auront lieu &agrave; Lille les 22, 23 et 24 mars 2027.</p>\r\n<p data-sourcepos=\"68:1-68:97\">\xd83c\xdf0d Pour pr&eacute;parer ces journ&eacute;es, l'appel &agrave; propositions vient d'ouvrir et nous avons besoin de vous !</p>\r\n<p data-sourcepos=\"68:1-68:97\">Pour un atelier de 3h, une conf&eacute;rence de 20 min ou une conf&eacute;rence &eacute;clair de 5 min : n'h&eacute;sitez pas, venez partager vos exp&eacute;riences avec la communaut&eacute;!</p>\r\n<p data-sourcepos=\"74:1-74:40\">\xd83d\xdd52 Date limite: 11 D&eacute;cembre prochain.</p>\r\n<p data-sourcepos=\"76:1-76:60\">\xd83d\xdc49 Pour proposer votre participation, double-cliquez sur cette actualit&eacute;!</p><p><strong>https://talks.osgeo.org/qgis-french-users-days-2027/cfp</strong></p>"
